<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>超越极限 · 战斗引擎</title>
<style>
:root {
  --bg: #2b2a33;
  --surface: #35344a;
  --surface-raised: #3e3d54;
  --border: #535164;
  --text: #c4c0d0;
  --text-dim: #7a768a;
  --accent: #DDBB99;
  --purple: #8b5cf6;
  --purple-glow: rgba(139,92,246,0.25);
  --red: #e05555;
  --red-glow: rgba(224,85,85,0.25);
  --amber: #d4943a;
  --amber-glow: rgba(212,148,58,0.25);
  --jade: #5a9e7e;
  --font-display: 'KaiTi', 'STKaiti', '楷体', 'FangSong', '仿宋', serif;
  --font-body: 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif;
}

@keyframes cloud-drift {
  0% { background-position: 0% 0%, 0% 0%; }
  100% { background-position: 200% 0%, 0% 0%; }
}

@keyframes pulse-glow {
  0%, 100% { box-shadow: 0 0 8px var(--purple-glow); }
  50% { box-shadow: 0 0 20px var(--purple-glow), 0 0 40px rgba(139,92,246,0.15); }
}

@keyframes fade-slide-up {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes check-bounce {
  0% { transform: scale(0); }
  60% { transform: scale(1.4); }
  100% { transform: scale(1); }
}

@keyframes phase-pulse {
  0%, 100% { border-color: #7a768a; }
  50% { border-color: var(--accent); }
}

@keyframes ripple {
  0% { transform: scale(0); opacity: 0.6; }
  100% { transform: scale(3); opacity: 0; }
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  overflow: hidden;
}

/* --- Start screen --- */
#start-screen { display: flex; flex-direction: column; align-items: center; gap: 20px; }
#start-screen h1 {
  font-family: var(--font-display);
  font-size: 38px;
  color: var(--accent);
  letter-spacing: 6px;
}
#start-screen .subtitle {
  font-size: 13px;
  color: var(--text-dim);
  letter-spacing: 3px;
  margin-bottom: 16px;
}
.mode-btn {
  width: 260px;
  padding: 14px 0;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--surface);
  color: var(--text);
  cursor: pointer;
  font-family: var(--font-display);
  font-size: 17px;
  letter-spacing: 3px;
  transition: all 0.3s;
  position: relative;
  overflow: hidden;
}
.mode-btn:hover {
  border-color: var(--accent);
  background: var(--surface-raised);
  color: var(--accent);
}
.mode-btn.primary { border-color: var(--accent); color: var(--accent); }
.mode-btn.primary:hover { background: rgba(221,187,153,0.08); }
.mode-btn::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, transparent 40%, rgba(221,187,153,0.06) 50%, transparent 60%);
  opacity: 0;
  transition: opacity 0.3s;
}
.mode-btn:hover::after { opacity: 1; }

#room-setup {
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  margin-top: 8px;
  padding: 20px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
  width: 310px;
}
#room-setup .room-code-display {
  font-family: var(--font-display);
  font-size: 32px;
  font-weight: 900;
  letter-spacing: 8px;
  color: var(--accent);
}
#room-setup input {
  width: 160px;
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--bg);
  color: var(--text);
  font-size: 18px;
  text-align: center;
  letter-spacing: 4px;
  font-family: 'Cascadia Code', monospace;
  text-transform: uppercase;
  transition: border-color 0.2s;
}
#room-setup input:focus { outline: none; border-color: var(--accent); }
#room-setup button {
  padding: 8px 24px;
  border: 1px solid var(--border);
  border-radius: 4px;
  cursor: pointer;
  font-family: var(--font-display);
  font-size: 14px;
  letter-spacing: 2px;
  transition: all 0.2s;
}
.btn-host { background: var(--red); color: white; border-color: var(--red); }
.btn-host:hover { background: #d45a5a; }
.btn-join { background: var(--purple); color: white; border-color: var(--purple); }
.btn-join:hover { background: #9d6eff; }
.btn-back { background: transparent; color: var(--text-dim); margin-top: 8px; }
.btn-back:hover { color: var(--text); border-color: var(--text-dim); }

.conn-status { font-size: 12px; color: var(--text-dim); }
.conn-status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
.conn-status .dot.red { background: var(--red); }
.conn-status .dot.yellow { background: var(--amber); }
.conn-status .dot.green { background: var(--jade); }

#room-error { font-size: 12px; color: var(--red); min-height: 16px; }

/* --- Game screen --- */
#app {
  display: none;
  grid-template-columns: 320px 285px 1fr 285px 320px;
  grid-template-rows: auto 1fr;
  gap: 8px;
  padding: 10px;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
}

#topbar {
  grid-column: 1/-1;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
  flex-wrap: wrap;
}
#topbar h1 {
  font-family: var(--font-display);
  font-size: 18px;
  color: var(--accent);
  letter-spacing: 3px;
  margin-right: auto;
}
#topbar .info { font-size: 14px; color: var(--text-dim); letter-spacing: 1px; }
#topbar button {
  padding: 6px 18px;
  border: 1px solid var(--border);
  border-radius: 4px;
  cursor: pointer;
  font-family: var(--font-display);
  font-size: 15px;
  letter-spacing: 2px;
  transition: all 0.2s;
}
#btn-execute {
  background: var(--accent);
  color: var(--bg);
  border-color: var(--accent);
  font-weight: 700;
}
#btn-execute:hover:not(:disabled) { background: #c9a87a; }
#btn-execute:disabled { background: #3e3d54; border-color: #3e3d54; color: #6a6680; cursor: not-allowed; }
#btn-reset { background: transparent; color: var(--text-dim); }
#btn-reset:hover { color: var(--text); border-color: var(--text-dim); }

#mode-badge {
  font-size: 11px;
  padding: 2px 10px;
  border-radius: 3px;
  font-weight: 700;
  letter-spacing: 1px;
}
#mode-badge.local { background: var(--surface); color: var(--text-dim); border: 1px solid var(--border); }
#mode-badge.online { background: rgba(90,158,126,0.12); color: var(--jade); border: 1px solid var(--jade); }

#phase-text {
  padding: 2px 8px;
  border-radius: 3px;
  font-weight: 700;
  letter-spacing: 2px;
  font-size: 12px;
  transition: all 0.5s;
}

#left-column {
  grid-row: 2;
  grid-column: 2;
  overflow: hidden;
  min-width: 0;
}
#panels-left {
  height: 100%;
}
#panels-left .char-panel {
  height: 100%;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
#log {
  grid-row: 2;
  grid-column: 1;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 6px 8px;
  overflow-y: auto;
  font-size: 16px;
  font-family: 'Cascadia Code', 'Consolas', monospace;
  word-break: break-all;
  overflow-wrap: break-word;
  color: var(--text);
}
.char-panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 10px 12px;
  min-width: 170px;
}
#panels-right {
  grid-row: 2;
  grid-column: 4;
  overflow: hidden;
}
#panels-right .char-panel {
  height: 100%;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.char-panel.mage { border-left: 3px solid var(--purple); }
.char-panel.warrior { border-left: 3px solid var(--red); }
.char-panel.shooter { border-left: 3px solid var(--amber); }
.char-panel.opponent-panel { opacity: 0.65; }

.panel-title {
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 2px;
  margin-bottom: 6px;
}
.char-panel.mage .panel-title { color: var(--purple); }
.char-panel.warrior .panel-title { color: var(--red); }
.char-panel.shooter .panel-title { color: var(--amber); }

.resources { font-size: 12px; margin-bottom: 4px; }
.resources span { margin-right: 8px; }
.buffs { font-size: 12px; margin-bottom: 4px; min-height: 16px; }
.buffs .buff {
  display: inline-block;
  background: rgba(221,187,153,0.08);
  border: 1px solid rgba(221,187,153,0.18);
  padding: 1px 5px;
  border-radius: 2px;
  margin: 1px 2px;
  color: var(--accent);
}

.skill-grid { display: flex; flex-direction: column; gap: 4px; flex: 1; overflow-y: auto; min-height: 0; padding-right: 2px; }
.skill-btn {
  width: 100%;
  padding: 8px 10px;
  border: 1px solid #122E8A;
  border-radius: 3px;
  background: #F5EFEA;
  color: #122E8A;
  cursor: pointer;
  text-align: left;
  font-size: 12px;
  transition: all 0.2s;
  position: relative;
  overflow: hidden;
}
.skill-btn:hover { background: #e8ddd0; border-color: #122E8A; }
.skill-btn.selected {
  background: #122E8A;
  color: #F5EFEA;
  border-color: #122E8A;
  font-weight: 700;
}
.skill-btn.selected .skill-name { color: #F5EFEA; }
.skill-btn.selected .skill-desc { color: rgba(245,239,234,0.8); }
.skill-btn.used { background: rgba(0,0,0,0.2); color: #555; border-color: #2a2a3a; cursor: not-allowed; }
.skill-btn.used .skill-name { color: #F5EFEA; }
.skill-btn.used .skill-desc { color: rgba(245,239,234,0.7); }
.skill-btn.opponent { opacity: 0.55; cursor: pointer; }
.skill-btn.opponent:hover { background: rgba(255,255,255,0.06); border-color: #535164; }
.skill-btn.used.opponent { cursor: pointer; }
.skill-btn.unaffordable { opacity: 0.42; }
.skill-btn.unaffordable:hover { opacity: 0.6; }

.skill-name { font-weight: 600; font-size: 16px; color: #122E8A; }
.skill-desc { font-size: 13px; color: #5a6a9a; }

/* Pagination */
.skill-page-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 4px;
  padding: 4px 0;
  flex-shrink: 0;
}
.skill-page-btn {
  flex: 0 0 auto;
  padding: 2px 8px;
  border: 1px solid #122E8A;
  border-radius: 3px;
  background: #F5EFEA;
  color: #122E8A;
  cursor: pointer;
  font-size: 12px;
  transition: all 0.2s;
}
.skill-page-btn:hover:not(:disabled) { background: #122E8A; color: #F5EFEA; }
.skill-page-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.skill-page-indicator { font-size: 12px; color: #ffffff; min-width: 32px; text-align: center; }

/* Ripple effect for skill buttons */
.skill-btn .ripple {
  position: absolute;
  border-radius: 50%;
  background: rgba(221,187,153,0.3);
  pointer-events: none;
  width: 20px;
  height: 20px;
  animation: ripple 0.6s ease-out forwards;
}

#canvas-wrap {
  grid-row: 2;
  grid-column: 3;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}
canvas {
  border-radius: 6px;
  background: #1e1d2a;
  border: 1px solid var(--border);
  cursor: crosshair;
  display: block;
}

.log-entry {
  padding: 1px 0;
  border-bottom: 1px solid rgba(83,81,100,0.4);
}
.log-rg { color: var(--red); }
.log-sh { color: #7b9fff; }
.log-die { color: #ff3333; }
.log-qi { color: var(--purple); }
.log-s { color: var(--text-dim); }
.log-warn { color: #d4943a; }
.log-turn { color: var(--accent); font-weight: bold; }
.log-action { color: #7bb8cf; }

/* --- Overlays --- */
#disconnect-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(20,19,26,0.88);
  z-index: 10;
  justify-content: center;
  align-items: center;
}
#disconnect-overlay.show { display: flex; }

#disconnect-overlay .box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 36px 52px;
  text-align: center;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
#disconnect-overlay .box h3 { color: var(--red); font-size: 18px; font-family: var(--font-display); }
#disconnect-overlay .box p { color: var(--text-dim); font-size: 13px; }
#disconnect-overlay .box button {
  padding: 8px 24px;
  border: 1px solid var(--border);
  border-radius: 4px;
  cursor: pointer;
  font-size: 14px;
  font-family: var(--font-display);
  background: var(--red);
  color: white;
}

/* --- Right sidebar (results / chat) --- */
#right-sidebar {
  grid-row: 2;
  grid-column: 5;
  display: flex;
  flex-direction: column;
  gap: 8px;
  overflow-y: auto;
}
#gameover-panel {
  display: none;
  background: var(--surface);
  border: 1px solid var(--accent);
  border-radius: 4px;
  padding: 10px;
  flex-direction: column;
}
#gameover-panel.show { display: flex; }
#gameover-panel .panel-title {
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 2px;
  color: var(--accent);
  text-align: center;
}
#gameover-panel button:hover { opacity: 0.85; }

#chat-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 8px;
  display: flex;
  flex-direction: column;
  flex: 1;
  min-height: 0;
}
#chat-messages {
  flex: 1;
  overflow-y: auto;
  font-size: 11px;
  color: var(--text-dim);
  margin-bottom: 6px;
  min-height: 0;
}
#chat-input {
  width: 100%;
  padding: 6px 8px;
  border: 1px solid var(--border);
  border-radius: 3px;
  background: var(--bg);
  color: var(--text);
  font-size: 11px;
  font-family: var(--font-body);
  resize: none;
}
#chat-input:focus { outline: none; border-color: var(--accent); }

/* --- Galaxy action bar --- */
#galaxy-overlay { display: none; position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 15; }
#galaxy-overlay.show { display: block; animation: fade-slide-up 0.3s ease-out; }
#galaxy-overlay .box {
  background: var(--surface);
  border: 1px solid var(--purple);
  border-radius: 6px;
  padding: 12px 20px;
  text-align: center;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  max-width: 700px;
  animation: pulse-glow 2s ease-in-out infinite;
}
#galaxy-overlay .box h3 {
  color: var(--purple);
  font-family: var(--font-display);
  font-size: 15px;
  letter-spacing: 3px;
  white-space: nowrap;
  margin: 0;
}
#galaxy-overlay .galaxy-hint { font-size: 11px; color: var(--text-dim); white-space: nowrap; }
#galaxy-overlay .skill-grid { display: flex; flex-wrap: wrap; gap: 4px; }
#galaxy-overlay .skill-btn {
  padding: 4px 10px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--surface);
  color: var(--text);
  cursor: pointer;
  font-size: 12px;
  white-space: nowrap;
  transition: all 0.2s;
}
#galaxy-overlay .skill-btn:hover { background: var(--surface-raised); border-color: var(--purple); }
#galaxy-overlay .skill-btn.selected { background: rgba(139,92,246,0.2); color: var(--purple); border-color: var(--purple); font-weight: 700; }
#galaxy-overlay .skill-desc { font-size: 9px; color: var(--text-dim); }
#galaxy-overlay .skill-btn.selected .skill-desc { color: #b49cf0; }

#galaxy-overlay .btn-skip {
  padding: 4px 16px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: transparent;
  color: var(--text-dim);
  cursor: pointer;
  font-size: 12px;
  white-space: nowrap;
  transition: all 0.2s;
}
#galaxy-overlay .btn-skip:hover { border-color: var(--text-dim); color: var(--text); }

/* Rematch selects */
select {
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 4px 8px;
  font-size: 13px;
  font-family: var(--font-body);
  cursor: pointer;
}
select:focus { outline: none; border-color: var(--accent); }
</style>
</head>
<body>

<!-- Start screen -->
<div id="start-screen">
  <h1>超越极限 · 战斗引擎</h1>
  <div class="subtitle">Hex-Grid Synchronous Turn-Based Combat</div>
  <button class="mode-btn primary" id="btn-local">本地游玩</button>
  <button class="mode-btn" id="btn-p2p">P2P 联机</button>
  <div id="room-setup">
    <div id="room-host-section" style="display:none">
      <input type="text" id="server-addr-input-host" placeholder="信令服务器地址" autocomplete="off" style="width:200px;padding:6px 10px;border:1px solid var(--border);border-radius:4px;background:var(--bg);color:var(--text);font-size:12px;text-align:center;">
      <button class="btn-host" id="btn-create-room">创建房间</button>
      <div class="conn-status"><span class="dot yellow"></span><span id="host-status-text">等待创建...</span></div>
      <div class="room-code-display" id="room-code-text" style="display:none"></div>
    </div>
    <div id="room-join-section" style="display:none">
      <input type="text" id="room-code-input" maxlength="4" placeholder="房间码" autocomplete="off">
      <input type="text" id="server-addr-input" placeholder="服务器地址" value="localhost:8088" autocomplete="off" style="width:200px;padding:6px 10px;border:1px solid var(--border);border-radius:4px;background:var(--bg);color:var(--text);font-size:12px;text-align:center;">
      <button class="btn-join" id="btn-join-room">加入房间</button>
      <div class="conn-status"><span class="dot yellow"></span><span id="join-status-text">输入房间码和地址</span></div>
    </div>
    <div id="room-error"></div>
    <button class="btn-back" id="btn-back-start">返回</button>
  </div>
  <div id="p2p-class-pick" style="display:none; flex-direction:column; align-items:center; gap:8px; margin-top:4px;">
    <span class="info">选择你的职业</span>
    <select id="p2p-class-select" style="padding:6px 12px; background:var(--surface); color:var(--text); border:1px solid var(--border); border-radius:4px; font-size:14px;">
      <option value="法师">法师</option>
      <option value="战士">战士</option>
      <option value="射手">射手</option>
    </select>
  </div>
</div>

<!-- Game screen -->
<div id="app">
  <div id="topbar">
    <h1>超越极限 · 战斗引擎</h1>
    <span id="mode-badge" class="local">本地</span>
    <span class="info" id="conn-indicator" style="display:none"><span class="dot green"></span>已连接</span>
    <span class="info">P1</span>
    <select id="p1-class-select">
      <option value="法师" selected>法师</option>
      <option value="战士">战士</option>
      <option value="射手">射手</option>
    </select>
    <span class="info">vs</span>
    <span class="info">P2</span>
    <select id="p2-class-select">
      <option value="法师">法师</option>
      <option value="战士" selected>战士</option>
      <option value="射手">射手</option>
    </select>
    <button id="btn-start">开始战斗</button>
    <span class="info">回合 <b id="turn-num">1</b></span>
    <span class="info">阶段 <b id="phase-text">PLAN</b></span>
    <span class="info" id="submit-status">等待双方提交...</span>
    <button id="btn-execute" disabled>执行回合</button>
    <button id="btn-reset">重置</button>
  </div>
  <div id="log"></div>
  <div id="left-column">
    <div id="panels-left"></div>
  </div>
  <div id="canvas-wrap"><canvas id="board"></canvas></div>
  <div id="panels-right"></div>
  <div id="right-sidebar">
    <div id="gameover-panel">
      <div class="panel-title">战斗结束</div>
      <p id="gameover-winner" style="color:var(--accent); font-size:15px; text-align:center; margin:8px 0;"></p>
      <div style="display:flex; flex-direction:column; gap:6px; margin:4px 0;">
        <div id="go-p1-pick">
          <label style="color:var(--text-dim); font-size:11px; display:block; margin-bottom:2px;">玩家1职业</label>
          <select id="rematch-class-p1" style="width:100%; background:var(--surface); color:var(--text); border:1px solid var(--border); border-radius:3px; padding:3px 6px; font-size:12px;">
            <option value="法师">法师</option>
            <option value="战士">战士</option>
            <option value="射手">射手</option>
          </select>
        </div>
        <div id="go-p2-pick">
          <label style="color:var(--text-dim); font-size:11px; display:block; margin-bottom:2px;">玩家2职业</label>
          <select id="rematch-class-p2" style="width:100%; background:var(--surface); color:var(--text); border:1px solid var(--border); border-radius:3px; padding:3px 6px; font-size:12px;">
            <option value="法师">法师</option>
            <option value="战士">战士</option>
            <option value="射手">射手</option>
          </select>
        </div>
      </div>
      <div style="display:flex; gap:6px; justify-content:center; margin-top:4px;">
        <button id="btn-rematch" style="padding:5px 14px;border:1px solid var(--accent);border-radius:3px;background:var(--accent);color:var(--bg);cursor:pointer;font-size:13px;font-family:var(--font-display);letter-spacing:1px;">重新开始</button>
        <button id="btn-lobby" style="padding:5px 14px;border:1px solid var(--border);border-radius:3px;background:transparent;color:var(--text-dim);cursor:pointer;font-size:13px;font-family:var(--font-display);letter-spacing:1px;">返回大厅</button>

<!-- Disconnect overlay -->
<div id="disconnect-overlay">
  <div class="box">
    <h3>对手已断开连接</h3>
    <p id="disconnect-reason"></p>
    <button onclick="returnToStart()">返回大厅</button>
  </div>
</div>

<!-- Galaxy action overlay -->
<div id="galaxy-overlay">
  <div class="box">
    <h3>银河远征</h3>
    <span class="galaxy-hint" id="galaxy-hint"></span>
    <div class="skill-grid" id="galaxy-skills"></div>
    <button id="btn-galaxy-confirm" style="padding:4px 16px;border:none;border-radius:6px;background:#7b2ff7;color:white;cursor:pointer;font-size:12px;font-weight:600;white-space:nowrap;" disabled>确认</button>
    <button class="btn-skip" id="btn-galaxy-skip">跳过全部</button>
  </div>
</div>

<script type="module">
import { GameEngine } from './engine/GameEngine.js';
import { NetworkManager } from './engine/NetworkManager.js';
import { SKILLS, SKILLS_BY_CLASS } from './engine/SkillData.js';
import { isOnBoard, hexCenter, hexCorners, pixelToHex, hexDistance, hexLine, hexSpiral, setCanvasSize } from './engine/HexMath.js';

// --- Init ---
const engine = new GameEngine();
let networkManager = null;  // null in local mode, NetworkManager in P2P mode

// Auto-detect if served through ngrok (for internet play)
const isNgrok = window.location.hostname.includes('ngrok-free');
const autoSignalingUrl = isNgrok
  ? `wss://${window.location.host}`
  : 'ws://120.77.178.15:8088';

// Set initial server address values
document.addEventListener('DOMContentLoaded', () => {
  const hostInput = document.getElementById('server-addr-input-host');
  const joinInput = document.getElementById('server-addr-input');
  if (hostInput) hostInput.value = isNgrok ? window.location.host : '120.77.178.15:8088';
  if (joinInput) joinInput.value = isNgrok ? window.location.host : '120.77.178.15:8088';
});
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  const wrap = document.getElementById('canvas-wrap');
  const w = wrap.clientWidth;
  const h = wrap.clientHeight;
  if (w <= 0 || h <= 0) return;
  canvas.width = w;
  canvas.height = h;
  setCanvasSize(w, h);
  renderAll();
}
window.addEventListener('resize', resizeCanvas);

let characterIds = [];
let localSubmittedSet = new Set();    // chars I submitted locally
let remoteSubmittedSet = new Set();   // chars opponent submitted (P2P only)
let selectedSkill = null;
let viewingSkill = null;   // view-only opponent skill inspection (shows range, can't submit)
let validTargets = [];
let hoveredHex = null;
let hoverEffectArea = [];
let turnTimeoutId = null;
let battleEnded = false;
let battleActive = false; // true while a game is in progress (set in initGame, cleared on BATTLE_END)
const skillPages = new Map(); // charId -> current page number (0-indexed)
let skillsPerPage = 10;

// Listen for battle end
engine.eventBus.on('BATTLE_END', (data) => {
  battleEnded = true;
  battleActive = false;
  showGameOver(data.winner);
});

// --- Galaxy sub-phase ---
let galaxyActive = false;
let galaxyCharId = null;
let galaxySelectedSkill = null;
let galaxyTargetPos = null;

let galaxyActionIndex = 0;
let galaxyActionTotal = 0;

engine.eventBus.on('GALAXY_SUBPHASE_START', (data) => {
  const myCharId = data.charIds.find(id => isMyCharacter(id));
  if (!myCharId) return;
  galaxyActive = true;
  galaxyCharId = myCharId;
  galaxySelectedSkill = null;
});

engine.eventBus.on('GALAXY_ACTION_PROMPT', (data) => {
  if (!galaxyActive || data.charId !== galaxyCharId) return;
  galaxyActionIndex = data.index;
  galaxyActionTotal = data.total;
  showGalaxyPanel();
});

engine.eventBus.on('GALAXY_SUBPHASE_END', () => {
  galaxyActive = false;
  galaxyCharId = null;
  galaxySelectedSkill = null;
  hideGalaxyPanel();
});

function showGalaxyPanel() {
  if (!galaxyCharId) return;
  const char = engine.registry.get(galaxyCharId);
  if (!char) return;

  document.getElementById('galaxy-hint').textContent =
    `行动 ${galaxyActionIndex + 1}/${galaxyActionTotal}`;

  const skillIds = SKILLS_BY_CLASS[char.class] || [];
  const skills = skillIds.filter(sid => {
    const skill = SKILLS[sid];
    return skill && !skill.hidden;
  }).map(sid => {
    const skill = SKILLS[sid];
    return `<button class="skill-btn" data-skill="${sid}" title="${skill.desc || ''}">${skill.name}</button>`;
  }).join('');

  document.getElementById('galaxy-skills').innerHTML = skills || '<span style="color:#888">无可用技能</span>';
  document.getElementById('btn-galaxy-confirm').disabled = true;

  document.querySelectorAll('#galaxy-skills .skill-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#galaxy-skills .skill-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      galaxySelectedSkill = btn.dataset.skill;
      document.getElementById('btn-galaxy-confirm').disabled = false;
    });
  });

  document.getElementById('galaxy-overlay').classList.add('show');
}

function hideGalaxyPanel() {
  document.getElementById('galaxy-overlay').classList.remove('show');
}

document.getElementById('btn-galaxy-confirm').addEventListener('click', () => {
  if (!galaxySelectedSkill) return;
  const skill = SKILLS[galaxySelectedSkill];
  if (!skill) return;

  if (skill.targeting.shape === 'SELF' || skill.targeting.shape === 'AOE_SELF') {
    // Self-targeting: submit immediately, panel stays hidden until next prompt
    engine.submitGalaxyAction(galaxySelectedSkill, null);
    if (networkManager && networkManager.mode !== 'local') {
      networkManager.sendGalaxyAction(galaxyCharId, galaxySelectedSkill, null);
    }
    galaxySelectedSkill = null;
    hideGalaxyPanel();
  } else {
    // Needs target: hide panel, show valid hexes on board
    hideGalaxyPanel();
    document.getElementById('submit-status').textContent = `银河远征: 点击棋盘选择 ${skill.name} 的目标`;

    const char = engine.registry.get(galaxyCharId);
    const range = skill.targeting.range ?? 99;
    validTargets = [];
    hoverEffectArea = [];
    hoveredHex = null;
    if (char) {
      for (let q = -3; q <= 3; q++) {
        for (let r = -3; r <= 3; r++) {
          if (!isOnBoard(q, r)) continue;
          if (q === char.position.q && r === char.position.r) continue;
          if (hexDistance(char.position.q, char.position.r, q, r) > range) continue;
          validTargets.push({ q, r });
        }
      }
    }
    renderAll();
  }
});

document.getElementById('btn-galaxy-skip').addEventListener('click', () => {
  engine.submitGalaxyAction(null, null);
  galaxySelectedSkill = null;
  hideGalaxyPanel();
});

// --- Start screen ---
document.getElementById('btn-local').addEventListener('click', () => {
  networkManager = null;
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('app').style.display = 'grid';
  document.getElementById('mode-badge').textContent = '本地';
  document.getElementById('mode-badge').className = 'local';
  document.getElementById('conn-indicator').style.display = 'none';
  document.getElementById('p1-class-select').style.display = '';
  document.getElementById('p2-class-select').style.display = '';
  document.getElementById('btn-start').style.display = '';
  document.getElementById('btn-reset').style.display = '';
  initGame(
    document.getElementById('p1-class-select').value,
    document.getElementById('p2-class-select').value
  );
});

document.getElementById('btn-p2p').addEventListener('click', () => {
  document.getElementById('room-setup').style.display = 'flex';
  document.getElementById('room-host-section').style.display = 'block';
  document.getElementById('room-join-section').style.display = 'block';
  document.getElementById('room-code-text').style.display = 'none';
  document.getElementById('room-error').textContent = '';
  document.getElementById('p2p-class-pick').style.display = 'flex';
});

document.getElementById('btn-back-start').addEventListener('click', () => {
  if (networkManager) { networkManager.disconnect(); networkManager = null; }
  document.getElementById('room-setup').style.display = 'none';
  document.getElementById('room-code-text').style.display = 'none';
  document.getElementById('room-error').textContent = '';
  resetConnectionUI();
});

document.getElementById('btn-create-room').addEventListener('click', async () => {
  document.getElementById('room-error').textContent = '';
  document.getElementById('room-code-text').style.display = 'none';
  updateHostStatus('connecting', '连接中...');
  const serverAddr = document.getElementById('server-addr-input-host').value.trim() || 'localhost:8088';
  const signalingUrl = serverAddr.match(/^wss?:\/\//) ? serverAddr : (isNgrok ? `wss://${serverAddr}` : `ws://${serverAddr}`);
  const nm = new NetworkManager({
    onStatusChange: (s) => {
      if (s.roomCode) {
        document.getElementById('room-code-text').textContent = s.roomCode;
        document.getElementById('room-code-text').style.display = 'block';
        updateHostStatus('connecting', '等待对手加入...');
      }
      if (s.status === 'connected') {
        updateHostStatus('connected', '已连接！');
        startP2PGame(nm);
      }
      if (s.error) {
        document.getElementById('room-error').textContent = s.error;
        updateHostStatus('disconnected', '错误');
        nm.disconnect();
      }
    },
    onDisconnect: (reason) => showDisconnect(reason),
    onRemoteSubmitted: (action) => handleRemoteAction(nm, action),
    onReady: () => executeP2PTurn(nm),
    onClassPick: (cls, seed) => onClassPick(nm, cls, seed),
    onGalaxyAction: (charId, skillId, targetPos) => {
      engine.submitGalaxyAction(skillId, targetPos);
    },
    onMessage: (payload) => handleNetworkMessage(payload),
  }, signalingUrl);
  networkManager = nm;
  try {
    await nm.createRoom();
  } catch (e) {
    document.getElementById('room-error').textContent = '连接服务器失败';
    updateHostStatus('disconnected', '连接失败');
    networkManager = null;
  }
});

document.getElementById('btn-join-room').addEventListener('click', async () => {
  const code = document.getElementById('room-code-input').value.toUpperCase().trim();
  if (!code || code.length !== 4) {
    document.getElementById('room-error').textContent = '请输入4位房间码';
    return;
  }
  document.getElementById('room-error').textContent = '';
  updateJoinStatus('connecting', '连接中...');
  const serverAddr = document.getElementById('server-addr-input').value.trim() || 'localhost:8088';
  const signalingUrl = serverAddr.match(/^wss?:\/\//) ? serverAddr : (isNgrok ? `wss://${serverAddr}` : `ws://${serverAddr}`);
  const nm = new NetworkManager({
    onStatusChange: (s) => {
      if (s.status === 'connected') {
        updateJoinStatus('connected', '已连接！');
        startP2PGame(nm);
      }
      if (s.error) {
        document.getElementById('room-error').textContent = s.error;
        updateJoinStatus('disconnected', '错误');
        nm.disconnect();
      }
    },
    onDisconnect: (reason) => showDisconnect(reason),
    onRemoteSubmitted: (action) => handleRemoteAction(nm, action),
    onReady: () => executeP2PTurn(nm),
    onClassPick: (cls, seed) => onClassPick(nm, cls, seed),
    onGalaxyAction: (charId, skillId, targetPos) => {
      engine.submitGalaxyAction(skillId, targetPos);
    },
    onMessage: (payload) => handleNetworkMessage(payload),
  }, signalingUrl);
  networkManager = nm;
  try {
    await nm.joinRoom(code);
  } catch (e) {
    document.getElementById('room-error').textContent = '连接服务器失败';
    updateJoinStatus('disconnected', '连接失败');
    networkManager = null;
  }
});

function updateHostStatus(status, text) {
  const dot = document.querySelector('#room-host-section .dot');
  dot.className = 'dot ' + (status === 'connected' ? 'green' : status === 'connecting' ? 'yellow' : 'red');
  document.getElementById('host-status-text').textContent = text;
}

function updateJoinStatus(status, text) {
  const dot = document.querySelector('#room-join-section .dot');
  dot.className = 'dot ' + (status === 'connected' ? 'green' : status === 'connecting' ? 'yellow' : 'red');
  document.getElementById('join-status-text').textContent = text;
}

function resetConnectionUI() {
  updateHostStatus('disconnected', '等待创建...');
  updateJoinStatus('disconnected', '输入房间码和地址');
  document.getElementById('room-code-input').value = '';
  const defaultAddr = isNgrok ? window.location.host : 'localhost:8088';
  document.getElementById('server-addr-input').value = defaultAddr;
  document.getElementById('server-addr-input-host').value = defaultAddr;
}

function startP2PGame(nm) {
  document.getElementById('gameover-panel').classList.remove('show');
  document.getElementById('panels-right').style.display = '';
  battleEnded = false;
  // Reset all rematch/class-pick state for fresh connection
  remoteClassPick = null;
  pendingRemoteRematchClass = null;
  opponentReadyForRematch = false;
  pendingMyClass = null;
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('app').style.display = 'grid';
  document.getElementById('mode-badge').textContent = '联机 ' + (nm.roomCode || '');
  document.getElementById('mode-badge').className = 'online';
  document.getElementById('conn-indicator').style.display = '';
  document.getElementById('p1-class-select').style.display = 'none';
  document.getElementById('p2-class-select').style.display = 'none';
  document.getElementById('btn-start').style.display = 'none';
  document.getElementById('btn-reset').style.display = 'none';

  const myClass = document.getElementById('p2p-class-select').value;
  // Host generates time-based seed for wild bullet spawn
  if (nm.myPlayerId === 'player1' && !battleSeed) battleSeed = Date.now();
  // Send class pick to peer — when both sides know, initGame will be called
  nm.sendClassPick(myClass, battleSeed);

  // If remote class already received (race condition), init now
  tryInitWithClasses(nm, myClass);

  document.getElementById('btn-execute').disabled = true;
  document.getElementById('submit-status').textContent = '等待对方选择职业...';
  document.getElementById('log').innerHTML = '';
  localSubmittedSet.clear();
  remoteSubmittedSet.clear();
}

let remoteClassPick = null;
let battleSeed = 0;         // host generates from Date.now(), shared via CLASS_PICK
let pendingMyClass = null; // for rematch: stored myClass when waiting for opponent
let pendingRemoteRematchClass = null; // CLASS_PICK from opponent that arrived while our game still active
let opponentReadyForRematch = false; // true when opponent already clicked rematch (shown in gameover UI)

function onClassPick(nm, remoteClass, seed = 0) {
  const gameoverShown = document.getElementById('gameover-panel').classList.contains('show');
  // Premature rematch: our game still running, opponent's game ended first.
  if (!gameoverShown && battleActive) {
    pendingRemoteRematchClass = remoteClass;
    return;
  }
  remoteClassPick = remoteClass;
  if (seed) battleSeed = seed;
  // Opponent clicked first while we're in game-over screen — show indicator
  if (gameoverShown && !pendingMyClass) {
    opponentReadyForRematch = true;
    updateRematchButton();
    return;
  }
  // Both sides have clicked: start the game
  const myClass = pendingMyClass || document.getElementById('p2p-class-select').value;
  // If we already clicked (premature sender), re-send our class so the other
  // side gets a fresh CLASS_PICK while their game-over is showing
  if (pendingMyClass) {
    nm.sendClassPick(myClass, battleSeed);
  }
  pendingMyClass = null;
  opponentReadyForRematch = false;
  tryInitWithClasses(nm, myClass);
}

function tryInitWithClasses(nm, myClass) {
  if (!remoteClassPick) return;
  const myId = nm.myPlayerId;
  const p1Class = myId === 'player1' ? myClass : remoteClassPick;
  const p2Class = myId === 'player2' ? myClass : remoteClassPick;
  remoteClassPick = null; // reset for reconnection
  initGame(p1Class, p2Class, battleSeed);
  battleSeed = 0; // reset for next game
  document.getElementById('submit-status').textContent = '等待双方提交...';
  startTurnTimeout();
}

function handleRemoteAction(nm, action) {
  // Apply opponent's action to our local engine
  engine.submitAction(action.charId, action.skillId, action.targetPos);
  remoteSubmittedSet.add(action.charId);
  updateSubmitStatus(nm);
  renderAll();
}

async function executeP2PTurn(nm) {
  clearTurnTimeout();
  const result = await engine.executeTurn();
  if (!result.success) return;

  localSubmittedSet.clear();
  remoteSubmittedSet.clear();
  nm.clearTurn();

  if (result.battleEnded) {
    renderAll();
    return;
  }

  animateTurn().then(() => {
    engine.projectileCalculator.clearKeyframes();
    renderAll();
    startTurnTimeout();
  });
}

function showDisconnect(reason) {
  document.getElementById('disconnect-reason').textContent =
    reason === 'peer_left' ? '对手离开了游戏' :
    reason === 'timeout' ? '连接超时' :
    reason === 'connection_lost' ? '网络连接中断' : '连接已断开';
  document.getElementById('disconnect-overlay').classList.add('show');
}

window.returnToStart = function() {
  clearTurnTimeout();
  battleActive = false;
  remoteClassPick = null;
  pendingRemoteRematchClass = null;
  opponentReadyForRematch = false;
  if (networkManager) { networkManager.disconnect(); networkManager = null; }
  document.getElementById('disconnect-overlay').classList.remove('show');
  document.getElementById('gameover-panel').classList.remove('show');
  document.getElementById('app').style.display = 'none';
  document.getElementById('start-screen').style.display = 'flex';
  document.getElementById('room-setup').style.display = 'none';
  document.getElementById('room-code-text').style.display = 'none';
  document.getElementById('p2p-class-pick').style.display = 'none';
  document.getElementById('room-host-section').style.display = 'block';
  document.getElementById('room-join-section').style.display = 'block';
  document.getElementById('conn-indicator').style.display = 'none';
  localSubmittedSet.clear();
  remoteSubmittedSet.clear();
  selectedSkill = null;
  viewingSkill = null;
  validTargets = [];
  hoverEffectArea = [];
  hoveredHex = null;
  battleEnded = false;
  resetConnectionUI();
};

function updateRematchButton() {
  const btn = document.getElementById('btn-rematch');
  if (opponentReadyForRematch) {
    btn.textContent = '对手已准备！重新开始';
  } else {
    btn.textContent = '重新开始';
  }
}

function showGameOver(winner) {
  clearTurnTimeout();
  document.getElementById('btn-execute').disabled = true;
  document.getElementById('submit-status').textContent = '战斗已结束';
  const winnerText = winner === 'player1' ? '玩家1' : winner === 'player2' ? '玩家2' : '平局';
  document.getElementById('gameover-winner').textContent = `胜者: ${winnerText}`;
  document.getElementById('rematch-class-p1').value = player1Class;
  document.getElementById('rematch-class-p2').value = player2Class;
  document.getElementById('btn-rematch').disabled = false;
  updateRematchButton();

  const isP2P = networkManager && networkManager.mode !== 'local';
  const myId = isP2P ? networkManager.myPlayerId : null;

  document.getElementById('go-p1-pick').style.display = (!isP2P || myId === 'player1') ? '' : 'none';
  document.getElementById('go-p2-pick').style.display = (!isP2P || myId === 'player2') ? '' : 'none';

  document.getElementById('panels-right').style.display = 'none';
  document.getElementById('gameover-panel').classList.add('show');
}

// Rematch button
document.getElementById('btn-rematch').addEventListener('click', () => {
  const isP2P = networkManager && networkManager.mode !== 'local';
  if (isP2P) {
    const myId = networkManager.myPlayerId;
    const myClass = myId === 'player1'
      ? document.getElementById('rematch-class-p1').value
      : document.getElementById('rematch-class-p2').value;
    pendingMyClass = myClass;
    if (networkManager.myPlayerId === 'player1') battleSeed = Date.now();
    networkManager.sendClassPick(myClass, battleSeed);
    // Hide rematch button, show waiting status (overlay stays until initGame)
    document.getElementById('btn-rematch').disabled = true;
    document.getElementById('btn-rematch').textContent = '等待对方...';
    document.getElementById('btn-execute').disabled = true;
    document.getElementById('submit-status').textContent = '等待对方选择职业...';
    document.getElementById('log').innerHTML = '';
    localSubmittedSet.clear();
    remoteSubmittedSet.clear();
    // If remote pick already arrived, init now
    tryInitWithClasses(networkManager, myClass);
  } else {
    document.getElementById('gameover-panel').classList.remove('show');
    const p1Class = document.getElementById('rematch-class-p1').value;
    const p2Class = document.getElementById('rematch-class-p2').value;
    battleEnded = false;
    initGame(p1Class, p2Class);
    document.getElementById('btn-execute').disabled = true;
    document.getElementById('submit-status').textContent = '等待提交...';
    document.getElementById('log').innerHTML = '';
    clearTurnTimeout();
    startTurnTimeout();
  }
});

// Return to lobby button
document.getElementById('btn-lobby').addEventListener('click', () => {
  document.getElementById('gameover-panel').classList.remove('show');
  returnToStart();
});

function startTurnTimeout() {
  clearTurnTimeout();
  turnTimeoutId = setTimeout(() => {
    // Auto-submit pass for any unsubmitted characters I own
    const myChars = getMyCharacterIds();
    for (const charId of myChars) {
      if (!localSubmittedSet.has(charId)) {
        const forcedId = engine.getForcedSkillId(charId);
        if (forcedId !== undefined) {
          submitAction(charId, forcedId, null);
        }
        // If no forced skill, the engine will handle PASS at execute time
      }
    }
  }, 60000);
}

function clearTurnTimeout() {
  if (turnTimeoutId) { clearTimeout(turnTimeoutId); turnTimeoutId = null; }
}

function getMyCharacterIds() {
  if (!networkManager || networkManager.mode === 'local') return characterIds;
  const myId = networkManager.myPlayerId;
  return engine.getCharactersByOwner(myId).map(c => c.id);
}

function isMyCharacter(charId) {
  if (!networkManager || networkManager.mode === 'local') return true;
  return engine.getCharacterOwner(charId) === networkManager.myPlayerId;
}

function updateSubmitStatus(nm) {
  const allAlive = characterIds.filter(id => engine.registry.get(id)?.alive !== false);
  if (nm && nm.mode !== 'local') {
    const localCount = allAlive.filter(id => localSubmittedSet.has(id)).length;
    const remoteCount = allAlive.filter(id => remoteSubmittedSet.has(id)).length;
    document.getElementById('submit-status').textContent =
      `你:${localCount} 对手:${remoteCount} / 共${allAlive.length}`;
    if (localSubmittedSet.size + remoteSubmittedSet.size >= allAlive.length) {
      // Both ready — NetworkManager.onReady will fire executeP2PTurn
      document.getElementById('submit-status').textContent = '双方就绪，执行中...';
    }
  } else {
    const submitted = allAlive.filter(id => localSubmittedSet.has(id)).length;
    if (submitted >= allAlive.length) {
      document.getElementById('btn-execute').disabled = false;
      document.getElementById('submit-status').textContent = '就绪！点击执行回合';
    } else {
      document.getElementById('submit-status').textContent = `已提交: ${submitted}/${allAlive.length}`;
    }
  }
}

// --- Setup ---
let player1Class = '法师';
let player2Class = '战士';

function initGame(p1Class, p2Class, seed = 0) {
  player1Class = p1Class || player1Class;
  player2Class = p2Class || player2Class;
  document.getElementById('gameover-panel').classList.remove('show');
  document.getElementById('panels-right').style.display = '';
  battleEnded = false;
  battleActive = true;
  remoteClassPick = null;
  pendingRemoteRematchClass = null;
  opponentReadyForRematch = false;
  engine.reset();
  const battleSeed = seed || Date.now();
  const result = engine.initBattle({ player1Class, player2Class, seed: battleSeed });
  characterIds = [result.player1Id, result.player2Id];
  localSubmittedSet.clear();
  remoteSubmittedSet.clear();
  selectedSkill = null;
  viewingSkill = null;
  validTargets = [];
  hoverEffectArea = [];
  hoveredHex = null;
  skillPages.clear();
  resizeCanvas();
  renderAll();
}

// --- Skill selection ---
function selectSkill(charId, skillId) {
  if (battleEnded) return;
  if (!isMyCharacter(charId)) return;
  if (localSubmittedSet.has(charId)) return;

  const skill = SKILLS[skillId];
  if (!skill) return;

  selectedSkill = { charId, skillId };
  viewingSkill = null;
  validTargets = [];
  hoverEffectArea = [];
  hoveredHex = null;

  const char = engine.registry.get(charId);
  if (!char) { renderAll(); return; }

  const shape = skill.targeting.shape;
  const range = skill.targeting.range ?? 99;

  if (shape === 'SELF' || shape === 'AOE_SELF') {
    validTargets = [{ q: -99, r: -99, self: true }];
  } else if (shape === 'HEX' || shape === 'DIRECTION') {
    for (let q = -3; q <= 3; q++) {
      for (let r = -3; r <= 3; r++) {
        if (!isOnBoard(q, r)) continue;
        const dist = hexDistance(char.position.q, char.position.r, q, r);
        if (dist > range) continue;
        validTargets.push({ q, r });
      }
    }
  }

  renderAll();
}

// View opponent skill range without allowing submission
function viewOpponentSkill(charId, skillId) {
  if (battleEnded) return;
  const skill = SKILLS[skillId];
  if (!skill) return;

  // Toggle off if already viewing this skill
  if (viewingSkill && viewingSkill.charId === charId && viewingSkill.skillId === skillId) {
    viewingSkill = null;
    validTargets = [];
    hoverEffectArea = [];
    hoveredHex = null;
    renderAll();
    return;
  }

  viewingSkill = { charId, skillId };
  selectedSkill = null;
  validTargets = [];
  hoverEffectArea = [];
  hoveredHex = null;

  const char = engine.registry.get(charId);
  if (!char) { renderAll(); return; }

  const shape = skill.targeting.shape;
  const range = skill.targeting.range ?? 99;

  if (shape === 'SELF' || shape === 'AOE_SELF') {
    validTargets = [{ q: char.position.q, r: char.position.r, self: true }];
  } else if (shape === 'HEX' || shape === 'DIRECTION') {
    for (let q = -3; q <= 3; q++) {
      for (let r = -3; r <= 3; r++) {
        if (!isOnBoard(q, r)) continue;
        const dist = hexDistance(char.position.q, char.position.r, q, r);
        if (dist > range) continue;
        validTargets.push({ q, r });
      }
    }
  }

  renderAll();
}

// --- Skill effect area preview (LoL-style hover indicator) ---
function simulateDash(fromPos, targetPos, eff) {
  const away = eff.direction === 'AWAY_FROM_TARGET';
  const steps = eff.distance || 1;

  let dirQ, dirR;
  if (away) {
    const line = hexLine(targetPos.q, targetPos.r, fromPos.q, fromPos.r);
    if (line.length < 2) return { q: fromPos.q, r: fromPos.r };
    dirQ = line[1][0] - line[0][0];
    dirR = line[1][1] - line[0][1];
  } else {
    const line = hexLine(fromPos.q, fromPos.r, targetPos.q, targetPos.r);
    if (line.length < 2) return { q: fromPos.q, r: fromPos.r };
    dirQ = line[1][0] - line[0][0];
    dirR = line[1][1] - line[0][1];
  }

  let curQ = fromPos.q, curR = fromPos.r;
  for (let s = 0; s < steps; s++) {
    const nq = curQ + dirQ, nr = curR + dirR;
    if (!isOnBoard(nq, nr)) break;
    curQ = nq; curR = nr;
  }
  return { q: curQ, r: curR };
}

function computeEffectArea(skill, charPos, hoveredTarget) {
  const area = new Set();
  let simPos = { q: charPos.q, r: charPos.r };

  for (const eff of skill.effects) {
    switch (eff.cmd) {
      case 'ATTACK_PROJECTILE':
      case 'ATTACK_AOE_PATH': {
        const line = hexLine(simPos.q, simPos.r, hoveredTarget.q, hoveredTarget.r);
        for (const [q, r] of line) area.add(`${q},${r}`);
        break;
      }
      case 'ATTACK_MELEE': {
        const dist = hexDistance(simPos.q, simPos.r, hoveredTarget.q, hoveredTarget.r);
        if (dist <= (eff.range || 1)) area.add(`${hoveredTarget.q},${hoveredTarget.r}`);
        break;
      }
      case 'ATTACK_AOE_SELF':
      case 'SPAWN_STATIONARY_AOE':
      case 'REACTIVE_ARMOR': {
        const hexes = hexSpiral(simPos.q, simPos.r, eff.radius || 1);
        for (const [q, r] of hexes) area.add(`${q},${r}`);
        break;
      }
      case 'ATTACK_AOE_TARGET': {
        const hexes = hexSpiral(hoveredTarget.q, hoveredTarget.r, eff.radius || 1);
        for (const [q, r] of hexes) area.add(`${q},${r}`);
        break;
      }
      case 'ATTACK_LINE': {
        const fwdLine = hexLine(simPos.q, simPos.r, hoveredTarget.q, hoveredTarget.r);
        // Forward: hexLine from caster to target (like 气功波), stops at target
        for (const [q, r] of fwdLine) {
          if (q === simPos.q && r === simPos.r) continue;
          area.add(`${q},${r}`);
        }
        // Reverse: opposite direction from caster to board edge
        if (fwdLine.length >= 2) {
          const dq = fwdLine[1][0] - fwdLine[0][0];
          const dr = fwdLine[1][1] - fwdLine[0][1];
          let curQ = simPos.q, curR = simPos.r;
          for (let i = 0; i < 10; i++) {
            curQ -= dq; curR -= dr;
            if (!isOnBoard(curQ, curR)) break;
            area.add(`${curQ},${curR}`);
          }
        }
        break;
      }
      case 'MOVE_DASH': {
        simPos = simulateDash(simPos, hoveredTarget, eff);
        area.add(`${simPos.q},${simPos.r}`);
        break;
      }
      case 'MOVE_GRAPNEL': {
        const path = hexLine(simPos.q, simPos.r, hoveredTarget.q, hoveredTarget.r);
        for (const [pq, pr] of path) {
          const nearby = hexSpiral(pq, pr, 1);
          for (const [nq, nr] of nearby) area.add(`${nq},${nr}`);
        }
        simPos = { q: hoveredTarget.q, r: hoveredTarget.r };
        break;
      }
      case 'MOVE_TELEPORT': {
        if (eff.target === 'BEHIND_TARGET') {
          const line = hexLine(simPos.q, simPos.r, hoveredTarget.q, hoveredTarget.r);
          const behindDirQ = line.length >= 2 ? line[1][0] - line[0][0] : 0;
          const behindDirR = line.length >= 2 ? line[1][1] - line[0][1] : 0;
          simPos = { q: hoveredTarget.q + behindDirQ, r: hoveredTarget.r + behindDirR };
        } else {
          simPos = { q: hoveredTarget.q, r: hoveredTarget.r };
        }
        area.add(`${simPos.q},${simPos.r}`);
        break;
      }
      case 'MOVE_WALK': {
        simPos = { q: hoveredTarget.q, r: hoveredTarget.r };
        area.add(`${simPos.q},${simPos.r}`);
        break;
      }
      case 'MOVE_PULL': {
        area.add(`${hoveredTarget.q},${hoveredTarget.r}`);
        area.add(`${charPos.q},${charPos.r}`);
        break;
      }
      case 'CREATE_GATE': {
        area.add(`${hoveredTarget.q},${hoveredTarget.r}`);
        break;
      }
      case 'CREATE_FORMATION': {
        const hexes = hexSpiral(hoveredTarget.q, hoveredTarget.r, 1);
        for (const [q, r] of hexes) area.add(`${q},${r}`);
        break;
      }
      case 'APPLY_STATUS': {
        if (eff.status === 'METEOR_ASCENDING') {
          const hexes = hexSpiral(hoveredTarget.q, hoveredTarget.r, 1);
          for (const [q, r] of hexes) area.add(`${q},${r}`);
        }
        break;
      }
    }
  }

  return [...area].map(k => { const [q, r] = k.split(',').map(Number); return { q, r }; });
}

// --- Canvas click ---
canvas.addEventListener('click', (e) => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const [hq, hr] = pixelToHex(mx, my);

  if (!isOnBoard(hq, hr)) return;

  // Galaxy sub-phase target selection (panel hidden, waiting for hex click)
  if (galaxyActive && galaxySelectedSkill && !document.getElementById('galaxy-overlay').classList.contains('show')) {
    const skill = SKILLS[galaxySelectedSkill];
    if (skill && skill.targeting.shape !== 'SELF' && skill.targeting.shape !== 'AOE_SELF') {
      engine.submitGalaxyAction(galaxySelectedSkill, { q: hq, r: hr });
      if (networkManager && networkManager.mode !== 'local') {
        networkManager.sendGalaxyAction(galaxyCharId, galaxySelectedSkill, { q: hq, r: hr });
      }
      galaxySelectedSkill = null;
      validTargets = [];
      hoverEffectArea = [];
      hoveredHex = null;
      document.getElementById('submit-status').textContent = '等待双方提交...';
      return;
    }
  }

  // If only viewing opponent skill, clicking a hex clears the view
  if (viewingSkill && !selectedSkill) {
    viewingSkill = null;
    validTargets = [];
    hoverEffectArea = [];
    hoveredHex = null;
    renderAll();
    return;
  }

  if (!selectedSkill) return;

  const charId = selectedSkill.charId;
  const skill = SKILLS[selectedSkill.skillId];

  if (skill.targeting.shape === 'SELF' || skill.targeting.shape === 'AOE_SELF') {
    submitAction(charId, selectedSkill.skillId, null);
    return;
  }

  // Click on invalid hex cancels selection
  if (!validTargets.some(t => t.q === hq && t.r === hr)) {
    selectedSkill = null;
    validTargets = [];
    hoverEffectArea = [];
    hoveredHex = null;
    renderAll();
    return;
  }

  submitAction(charId, selectedSkill.skillId, { q: hq, r: hr });
});

function submitAction(charId, skillId, targetPos) {
  if (battleEnded) return;
  if (!isMyCharacter(charId)) return;

  const result = engine.submitAction(charId, skillId, targetPos);
  if (result.success) {
    localSubmittedSet.add(charId);
    selectedSkill = null;
    validTargets = [];
    hoverEffectArea = [];
    hoveredHex = null;
    skillPages.set(charId, 0);

    if (networkManager && networkManager.mode !== 'local') {
      networkManager.submitMyAction(charId, skillId, targetPos);
    }
    updateSubmitStatus(networkManager);
  }
  renderAll();
}

// --- Execute turn ---
